services:
  flux:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-local}
        BUILD_TIME: ${BUILD_TIME:-}
    image: flux-local:compose
    container_name: ${FLUX_SETUP_CONTAINER_NAME:-flux-local-web}
    ports:
      - "${FLUX_SETUP_PORT:-3001}:${PORT:-3000}"
    volumes:
      - flux-local-data:/app/packages/data
    environment:
      FLUX_DIR: /app/packages/data/.flux
      FLUX_DATA: /app/packages/data/flux.sqlite
      PORT: ${PORT:-3000}
      FLUX_API_KEY: ${FLUX_API_KEY:-}
      FLUX_MAX_BLOB_SIZE: ${FLUX_MAX_BLOB_SIZE:-}

volumes:
  flux-local-data:
    name: ${FLUX_SETUP_VOLUME_NAME:-flux-local-data}
